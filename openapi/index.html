<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jewels API Docs</title>
    <link href="https://fonts.jinya.de/css2?family=Albert Sans:wght@300;400;700" rel="stylesheet">
    <link href="https://fonts.jinya.de/css2?family=Oxygen Mono" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

    <meta name="msapplication-TileColor" content="#28aef0">
    <meta name="theme-color" content="#28aef0">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --scalar-font: 'Albert Sans', sans-serif;
            --scalar-font-code: 'Oxygen Mono', monospace;
        }
    </style>
</head>
<body>
<div id="app"></div>
<!-- Load the Script -->
<script src="/openapi/scalar.js"></script>
<!-- Initialize the API Reference -->
<script>
    Scalar.createApiReference('#app', [
        {
            layout: "modern",
            theme: "none",
            hideClientButton: true,
            telemetry: false,
            withDefaultFonts: false,
            agent: {
                disabled: true,
            },
            title: "Jewels V3",
            slug: "jewels-v3",
            url: '/openapi/v3.yaml',
        },
        {
            layout: "modern",
            theme: "none",
            hideClientButton: true,
            telemetry: false,
            withDefaultFonts: false,
            agent: {
                disabled: true,
            },
            title: "Jewels V2",
            slug: "jewels-v2",
            url: '/openapi/v2.yaml',
        },
    ])
</script>
</body>
</html>
